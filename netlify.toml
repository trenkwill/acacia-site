[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301

[[redirects]]
  from = "/acacia.html"
  to = "/acacia"
  status = 301

[[redirects]]
  from = "/projets.html"
  to = "/projets"
  status = 301

[[redirects]]
  from = "/products.html"
  to = "/products"
  status = 301

[[redirects]]
  from = "/architects.html"
  to = "/architects"
  status = 301

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301

# CMS admin (sans la barre finale)
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
