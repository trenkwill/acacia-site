# Sveltia CMS configuration
# Compatible avec Decap CMS (drop-in replacement)
# Auth: GitHub OAuth direct (pas de Netlify Identity / Git Gateway)
#
# Pour activer : déployer un Worker Cloudflare Sveltia CMS Auth, créer une
# OAuth App GitHub avec callback https://<worker>.workers.dev/callback,
# puis renseigner backend.base_url ci-dessous avec l'URL du Worker.

backend:
  name: github
  repo: trenkwill/acacia-site   # repo GitHub source
  branch: main
  base_url: https://sveltia-auth.example.workers.dev
  auth_endpoint: auth

publish_mode: simple
locale: fr

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

site_url: https://acacia-france.netlify.app
display_url: https://acacia-france.netlify.app
logo_url: /images/logo_acacia.jpg

collections:
  - name: products
    label: "Produits"
    label_singular: "Produit"
    folder: "src/content/products"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: [order, title, category]
    fields:
      - { label: "Titre", name: title, widget: string }
      - { label: "Image", name: image, widget: image }
      - label: "Catégorie"
        name: category
        widget: select
        options:
          - { label: "Poteaux & piquets", value: poteaux }
          - { label: "Lames & terrasse", value: lames }
          - { label: "Aménagement intérieur", value: interieur }
          - { label: "Aménagement extérieur", value: amenagement }
        default: poteaux
      - { label: "Ordre d'affichage", name: order, widget: number, default: 0, value_type: int }
      - { label: "Style image (CSS)", name: image_style, widget: string, required: false, hint: "Ex : object-fit: contain" }
      - { label: "Brouillon", name: draft, widget: boolean, default: false }
      - { label: "Description", name: body, widget: markdown }

  - name: projects
    label: "Projets industriels"
    label_singular: "Projet"
    folder: "src/content/projects"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: [order, title]
    fields:
      - { label: "Titre", name: title, widget: string }
      - { label: "Image", name: image, widget: image }
      - { label: "Description", name: description, widget: text }
      - { label: "Lieu", name: location, widget: string, required: false }
      - { label: "Ordre d'affichage", name: order, widget: number, default: 0, value_type: int }
      - { label: "Brouillon", name: draft, widget: boolean, default: false }

  - name: pages
    label: "Pages éditoriales"
    label_singular: "Page"
    folder: "src/content/pages"
    create: false
    delete: false
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { label: "Titre (interne)", name: title, widget: string }
      - { label: "Description SEO", name: seo_description, widget: text, required: false }
      - { label: "Titre principal (hero)", name: hero_title, widget: text, required: false }
      - { label: "Image principale (hero)", name: hero_image, widget: image, required: false }
      - { label: "Baseline (hero)", name: hero_baseline, widget: string, required: false }
      - { label: "Libellé du bouton (hero)", name: hero_cta_label, widget: string, required: false }
      - { label: "Lien du bouton (hero)", name: hero_cta_url, widget: string, required: false }
      - { label: "Sous-titre (lead)", name: lead, widget: string, required: false }
      - { label: "Contenu", name: body, widget: markdown, required: false }

  - name: settings
    label: "Réglages du site"
    files:
      - label: "Réglages généraux"
        name: general
        file: "src/data/settings.json"
        format: json
        fields:
          - { label: "Titre du site", name: site_title, widget: string }
          - { label: "Tagline", name: tagline, widget: string }
          - { label: "Logo", name: logo, widget: image }
          - label: "Items de navigation"
            name: nav_items
            widget: list
            fields:
              - { label: "Libellé", name: label, widget: string }
              - { label: "URL", name: url, widget: string }
          - { label: "Email du footer", name: footer_email, widget: string }
          - { label: "Crédits du footer", name: footer_credits, widget: string }
          - label: "Contact principal"
            name: contact_main
            widget: object
            fields:
              - { label: "Libellé", name: label, widget: string }
              - { label: "Personne", name: person, widget: string }
              - { label: "Téléphone (affichage)", name: phone, widget: string }
              - { label: "Téléphone (lien)", name: phone_link, widget: string, hint: "Ex : tel:+33680131598" }
              - { label: "Email", name: email, widget: string }
          - label: "Contact technique"
            name: contact_technical
            widget: object
            fields:
              - { label: "Libellé", name: label, widget: string }
              - { label: "Personne", name: person, widget: string }
              - { label: "Email", name: email, widget: string }
              - { label: "Note", name: note, widget: string }
          - { label: "Texte de la mission", name: mission_text, widget: text }
